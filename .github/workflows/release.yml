name: release

# 版本号一改、push 到 main：先建 Release（tag = v<version>），紧接着发到 npm。
# 放在同一个 workflow 里，是因为用 github.token 建出来的 Release 不会再触发
# publish.yml（GitHub 会掐掉 GITHUB_TOKEN 造成的连锁 workflow）。publish.yml 留着手动补发。
# 需要的仓库 secret：NPM_TOKEN —— npmjs.com 的 Automation token（auth-and-writes 账号只有它能绕 2FA）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm publish --provenance 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test (skipped when the package has no test script)
        run: npm test --if-present

      - name: Create release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, nothing to do"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes

      - name: Skip when this version is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published, nothing to do"
          fi

      - name: Check the NPM_TOKEN secret
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_TOKEN is not set, skipping npm publish"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already != 'true' && steps.token.outputs.ok == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
