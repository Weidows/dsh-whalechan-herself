name: release

# 版本号一改、push 到 main：先建 Release（tag = v<version>），紧接着发到 npm。
# 发布走 npm Trusted Publishing（OIDC），仓库里不再有任何 npm 凭证 —— 不需要 NPM_TOKEN。
# npm 上该包已绑定：github · Weidows/dsh-whalechan-herself · release.yml · allow: npm publish
# 这个文件名是信任契约的一部分 —— 改名 = 立即 ENEEDAUTH。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # OIDC：npm 用它换短时令牌，provenance 自动生成

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing 要 npm >= 11.5.1，别依赖镜像自带的版本
      - run: npm install -g npm@^11.15.0 && npm --version

      - name: Test (skipped when the package has no test script)
        run: npm test --if-present

      - name: Create release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, nothing to do"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

      - name: Skip when this version is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published, nothing to do"
          fi

      # 无 NODE_AUTH_TOKEN；无 --provenance（OIDC 自动带）；无 --access public
      #（package.json 的 publishConfig 已经写了 access + registry）
      - name: Publish to npm
        if: steps.published.outputs.already != 'true'
        run: npm publish
